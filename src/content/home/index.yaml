about:
  heading: About Jan
  paragraph1: >-
    As <strong>Co-founder & CTO</strong> at Express My Health, a Computer
    Science Engineering student at <strong>FIB (UPC)</strong> and a
    <strong>Software Developer</strong> at Lanaccess, I am focused on building
    robust, well-designed software systems. Driven by curiosity, with a
    particular interest in understanding complex systems and solving challenging
    problems.
  paragraph2: >-
    A growing interest in <strong>Project Management</strong> provides a
    complementary perspective to technical training, especially in aligning
    technology with strategic outcomes and efficient collaboration.
  paragraph2Comment: >-
    Born and based in Barcelona, with three years spent living in Ireland,
    bringing a mindset shaped by engineering rigor and a hands-on drive to craft
    meaningful, lasting solutions.
