about:
  heading: About Jan
  paragraph1: >-
    Computer Science Engineering graduate from the <strong>UPC</strong>, working
    at the intersection of product, data and technology. As
    <strong>Co-founder & CTO</strong> at Express My Health, I lead the technical
    vision, architecture and product direction of a secure assistive
    communication platform. At Dot Consulting I work as
    <strong>Data Engineer & BIA</strong>, turning data and AI into analyses
    and tools the business can actually use.
  paragraph2: >-
    Beyond software, I'm into <strong>finance and investments</strong>, and
    just as much into <strong>sport</strong>.
  paragraph2Comment: >-
    Born and based in Barcelona, with three years spent living in Ireland,
    bringing a mindset shaped by engineering rigor and a hands-on drive to craft
    meaningful, lasting solutions.
