<div class="reading-progress-bar" [style.width.%]="readingProgress"></div>

<app-page-nav></app-page-nav>

<div class="post-container">
  @if(post) {
    <article class="post-content">
      <a routerLink="/blog" class="back-to-blog">&larr; Back to all posts</a>
      <header class="post-header">
        <h1 class="post-title">{{ post.title }}</h1>
        <p class="post-meta">
          Published on <time [attr.datetime]="post.date">{{ post.date | date: 'longDate' }}</time>
          <span class="meta-separator">&bull;</span>
          <span>{{ post.readingTime }} min read</span>
        </p>
      </header>
      <div class="post-body" [innerHTML]="postContent"></div>
    </article>
  } @else {
    <p class="no-posts-message">Post not found.</p>
  }
</div>
