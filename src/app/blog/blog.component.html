<!-- src/app/blog/blog.component.html -->

<div class="page-nav-controls">
  <button class="nav-button terminal-toggle" (click)="navigateToTerminal()"
  [attr.aria-label]="navCtrl_terminal_ariaLabel">
  <span class="material-symbols-outlined">terminal</span>
</button>
<button class="nav-button theme-toggle" (click)="toggleTheme()" [attr.aria-label]="navCtrl_themeToggle_ariaLabel"
[attr.aria-pressed]="currentTheme === 'dark'">
<span class="material-symbols-outlined icon-sun">light_mode</span>
<span class="material-symbols-outlined icon-moon">dark_mode</span>
</button>
<button class="nav-button home-button-page" (click)="navigateToHome()" [attr.aria-label]="navCtrl_home_ariaLabel">
  <span class="material-symbols-outlined">home</span>
</button>
</div>

<div class="blog-container">
  <header class="blog-header">
    <h1 class="blog-main-title">The Prompt</h1>
    <p class="blog-subtitle">Thoughts on software, technology, and everything in between.</p>
  </header>

  <main class="post-list">
    @for (post of posts; track post.slug) {
      <a [routerLink]="['/blog', post.slug]" class="post-card-link">
        <article class="post-card">
          <h2 class="post-card-title">{{ post.title }}</h2>
          <p class="post-card-summary">{{ post.summary }}</p>
          <div class="post-card-footer">
            <time [attr.datetime]="post.date" class="post-card-date">{{ post.date | date: 'longDate' }}</time>
            <span class="post-card-readmore">Read More &rarr;</span>
          </div>
        </article>
      </a>
    }
  </main>

  <footer class="site-footer">
    <p>© {{_currentYear()}} Jan Rosell. All rights reserved.</p>
  </footer>
</div>
