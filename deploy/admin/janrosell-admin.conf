# Password-protected reports. Served by nginx, not by the Astro app.
# Included from the janrosell.com HTTPS server.

location = /stats {
    return 301 /stats/;
}

location ^~ /stats/ {
    root /var/www/janrosell-admin;
    index index.html;
    auth_basic "janrosell";
    auth_basic_user_file /etc/nginx/htpasswd/janrosell-admin;
    autoindex off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
}

location = /server {
    return 301 /server/;
}

location ^~ /server/ {
    root /var/www/janrosell-admin;
    index index.html;
    auth_basic "janrosell";
    auth_basic_user_file /etc/nginx/htpasswd/janrosell-admin;
    autoindex off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
}
